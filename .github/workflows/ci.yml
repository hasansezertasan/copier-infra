name: CI

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same jobs before it releases.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install copier==9.18.2
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          working_directory: template
      - run: ./scripts/test-template.sh
      - run: node --test "tests/*.test.mjs"
