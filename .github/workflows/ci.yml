name: CI

# Unfiltered on purpose: a required check must always report. Reusable so the
# release workflow runs the very same jobs before it releases.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install copier==9.18.2
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: template
        env:
          # mise merges config from parent directories. Stop at the workspace so the root
          # .config/mise.toml (python, uv, cobo) stays out of the template's locked install.
          MISE_CEILING_PATHS: ${{ github.workspace }}
      - run: ./scripts/test-template.sh
      - run: node --test "tests/*.test.mjs"
      - run: ./scripts/test-update.sh
